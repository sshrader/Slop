<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Number go up · HyperSlop</title>
<meta name="description" content="Drag the last candle. Watch the caption react. A chart is only as honest as the person holding it.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="lab.css">
<style>
canvas{width:100%;height:auto;background:#050607;border:1px solid var(--line);border-radius:14px;touch-action:none;cursor:ns-resize}
#cap{font:700 clamp(20px,4vw,30px)/1.2 "Space Grotesk",system-ui,sans-serif;margin:16px 0 4px;min-height:40px}
#pc{font:500 15px "JetBrains Mono",monospace;color:var(--mut)}
</style></head><body>
<div class="wrap">
<header class="lab"><a class="logo" href="index.html">HyperSlop<span>.ai</span></a><a class="back" href="index.html#lab">← All experiments</a></header>
<span class="tag">Toy</span>
<h1>Number go up</h1>
<p class="sub">Drag the last candle. Watch the caption react. A chart is only as honest as the person holding it.</p>
<canvas id="cv" width="900" height="420"></canvas><div id="cap"></div><div id="pc"></div><div class="row" style="margin-top:16px"><button class="btn pri" id="up" type="button">Pump</button><button class="btn" id="dn" type="button">Dump</button><button class="btn" id="rs" type="button">Reset</button></div>
</div>
<footer class="lab"><div class="wrap">Internal experiment. HyperSlop is a fictional brand, not a live token.</div></footer>
<script src="lab.js"></script>
<script>
var N=48,c,x=$('cv').getContext('2d'),S=[],start=100;
function reset(){var r=rng(Date.now()),v=100;S=[];for(var i=0;i<N;i++){var o=v;v=Math.max(20,v+(r()-.5)*7);S.push([o,v])}start=S[0][0];draw()}
function lo(){return Math.min.apply(null,S.map(function(s){return Math.min(s[0],s[1])}))*.92}
function hi(){return Math.max.apply(null,S.map(function(s){return Math.max(s[0],s[1])}))*1.08}
var CAPS=[[-70,'This is fine.'],[-30,'Healthy correction.'],[-8,'Accumulation zone.'],[8,'Consolidating.'],[40,'Number go up.'],[120,'We are so early.'],[1e9,'Generational.']];
function draw(){var W_=900,H=420,a=lo(),b=hi(),Y=function(v){return H-24-(v-a)/(b-a)*(H-48)};x.clearRect(0,0,W_,H);
 x.strokeStyle='#14181d';x.lineWidth=1;for(var i=1;i<5;i++){x.beginPath();x.moveTo(0,i*H/5);x.lineTo(W_,i*H/5);x.stroke()}
 var w=W_/N;S.forEach(function(s,i){var up=s[1]>=s[0],col=up?'#c6ff3d':'#ff5a5a';x.strokeStyle=col;x.fillStyle=col;var cx=i*w+w/2,top=Y(Math.max(s[0],s[1])),bt=Y(Math.min(s[0],s[1]));x.beginPath();x.moveTo(cx,top-6);x.lineTo(cx,bt+6);x.stroke();x.fillRect(cx-w*.3,top,w*.6,Math.max(2,bt-top))});
 var last=S[S.length-1][1],ch=(last-start)/start*100;$('pc').textContent=(ch>=0?'+':'')+ch.toFixed(1)+'% since open';var t=CAPS.find(function(c){return ch<c[0]})||CAPS[CAPS.length-1];$('cap').textContent=t[1]}
function setLast(py){var H=420,a=lo(),b=hi(),f=py/($('cv').getBoundingClientRect().height)*H;var v=a+(H-24-f)/(H-48)*(b-a);S[S.length-1][1]=Math.max(10,v);draw()}
var drag=false;$('cv').addEventListener('pointerdown',function(e){drag=true;$('cv').setPointerCapture(e.pointerId);setLast(e.clientY-$('cv').getBoundingClientRect().top)});
$('cv').addEventListener('pointermove',function(e){if(drag)setLast(e.clientY-$('cv').getBoundingClientRect().top)});
$('cv').addEventListener('pointerup',function(){drag=false});
function push(dir){var t=0,iv=setInterval(function(){var l=S[S.length-1][1];S.shift();S.push([l,Math.max(10,l*(1+dir*(.05+Math.random()*.06)))]);draw();if(++t>9)clearInterval(iv)},70)}
$('up').onclick=function(){push(1)};$('dn').onclick=function(){push(-1)};$('rs').onclick=reset;reset();</script>
</body></html>
