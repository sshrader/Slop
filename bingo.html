<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Red-flag bingo · HyperSlop</title>
<meta name="description" content="Tap a square whenever a project does the thing. Five in a row wins. Try it on a real launch feed and see how fast it fills.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="lab.css">
<style>
.bg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.bg button{font:inherit;font-size:clamp(9.5px,2.3vw,14px);line-height:1.25;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;min-width:0;overflow-wrap:anywhere;hyphens:auto;aspect-ratio:1;cursor:pointer;display:grid;place-items:center;text-align:center;transition:.15s}
.bg button.on{background:rgba(198,255,61,.14);border-color:var(--acid);color:var(--acid)}
.bg button.win{background:var(--acid);color:#0b0d06;border-color:var(--acid);font-weight:700}
#msg{height:34px;font:700 22px "Space Grotesk",system-ui,sans-serif;color:var(--acid);margin-bottom:10px}
</style></head><body>
<div class="wrap">
<header class="lab"><a class="logo" href="index.html">HyperSlop<span>.ai</span></a><a class="back" href="index.html#lab">← All experiments</a></header>
<span class="tag">Game</span>
<h1>Red-flag bingo</h1>
<p class="sub">Tap a square whenever a project does the thing. Five in a row wins. Try it on a real launch feed and see how fast it fills.</p>
<div id="msg"></div><div class="bg" id="bg"></div><div class="row" style="margin-top:16px"><button class="btn pri" id="sh" type="button">New card</button></div>
</div>
<footer class="lab"><div class="wrap">Internal experiment. HyperSlop is a fictional brand, not a live token.</div></footer>
<script src="lab.js"></script>
<script>
var F=['Anonymous team','"Stealth" partnerships','Roadmap says Q3','Utility: soon','"Community-owned"','Mentions AI 3+ times','Zero source code','Mascot is an animal','"Fair launch"','Countdown timer','"Layer 3"','Telegram full of bots','Founder "not a dev"','Logo is AI-generated','"Quantum-resistant"','Token before product','"Audit coming soon"','Promises of 100x','Whitepaper is 2 pages','Celebrity "endorsement"','Liquidity "locked" (no proof)','Website is one page','"Revolutionary"','Dev wallet holds 30%','Tweets all caps'];
var cells,marked;
function deal(){cells=shuffle(F).slice(0,24);cells.splice(12,0,'FREE');marked=[];for(var i=0;i<25;i++)marked[i]=i===12;draw();check()}
function draw(){var g=$('bg');g.innerHTML='';cells.forEach(function(t,i){var b=document.createElement('button');b.type='button';b.textContent=t;if(marked[i])b.className='on';b.onclick=function(){if(i===12)return;marked[i]=!marked[i];draw();check()};g.appendChild(b)})}
function check(){var L=[];for(var r=0;r<5;r++){L.push([0,1,2,3,4].map(function(c){return r*5+c}));L.push([0,1,2,3,4].map(function(c){return c*5+r}))}L.push([0,6,12,18,24],[4,8,12,16,20]);
 var win=L.filter(function(l){return l.every(function(i){return marked[i]})});var btn=$('bg').children;
 for(var i=0;i<25;i++)if(win.some(function(l){return l.indexOf(i)>-1}))btn[i].className='win';
 $('msg').textContent=win.length?'BINGO. You found a real one.':''}
$('sh').onclick=deal;deal();</script>
</body></html>
